<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · Haulnet docs</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="article">
<meta property="og:url" content="{{canonical}}">
<meta property="og:title" content="{{title}} · Haulnet docs">
<meta property="og:description" content="{{description}}">
<meta property="og:site_name" content="Haulnet">
<meta property="og:locale" content="en_US">
<meta property="og:image" content="https://haulnet.cc/assets/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="Haulnet logo: two players joined by a route, carrying a crate">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/style.css">
</head>
<body>
{{header}}

<div class="wrap docs">
  <nav class="docs-nav" aria-label="Documentation">
    <ul>
{{docs_nav}}
    </ul>
  </nav>
  <main class="doc">
{{content}}
    <p class="small edit">Something wrong or missing on this page?
      <a href="https://github.com/haulnet/haulnet.github.io/issues/new">Open an issue</a> or a pull request to
      <a href="https://github.com/haulnet/haulnet.github.io">haulnet.github.io</a>.</p>
  </main>
</div>

{{footer}}
</body>
</html>
